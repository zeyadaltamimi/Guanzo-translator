const PRICE_TABLE = [
  [/^gemini-2\.5-flash-lite/, { t: 0.10, a: 0.30, o: 0.40 }],
  [/^gemini-3\.1-flash-lite/, { t: 0.25, a: 0.50, o: 1.50 }],
  [/^gemini-3\.5-flash-lite/, { t: 0.30, a: 0.30, o: 2.50 }],
  [/flash-lite/, { t: 0.30, a: 0.30, o: 2.50 }],
  [/^gemini-2\.5-flash/, { t: 0.30, a: 1.00, o: 2.50 }],
  [/flash/, { t: 0.75, a: 0.75, o: 3.75 }],
  [/pro/, { t: 2.00, a: 2.00, o: 12.00 }]
];
function priceOf(model) { for (const [re, p] of PRICE_TABLE) if (re.test(model || '')) return p; return { t: 0.75, a: 0.75, o: 3.75 }; }
// a typical spoken turn: ~520 prompt text tokens, ~160 audio tokens (5 s), ~90 output tokens
const per1000USD = model => { const p = priceOf(model); return (520 * p.t + 160 * p.a + 90 * p.o) / 1e6 * 1000; };
const per1000Text = model => { const u = per1000USD(model); const h = S.cur === 'USD' ? null : usdToHome(u); return h != null ? money(h, S.cur) : fmtUSD(u); };
const TIERS = [
  { id: 'eco', prefer: ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemini-flash-lite-latest'], match: /^gemini-\d+(\.\d+)?-flash-lite$/, fallback: 'gemini-3.1-flash-lite', recommended: true },
  { id: 'bal', prefer: [], match: /^gemini-\d+(\.\d+)?-flash-lite$/, fallback: 'gemini-flash-lite-latest' },
  { id: 'best', prefer: [], match: /^gemini-\d+(\.\d+)?-flash$/, fallback: 'gemini-flash-latest' }
];
function verOf(id) { const m = String(id).match(/^gemini-(\d+)(?:\.(\d+))?-/); return m ? [+m[1], +(m[2] || 0)] : [0, 0]; }
function cmpVer(a, b) { const x = verOf(a), y = verOf(b); return (y[0] - x[0]) || (y[1] - x[1]); }
function resolveTier(tierId, list) {
  const T = TIERS.find(x => x.id === tierId) || TIERS[0];
  const L = Array.isArray(list) ? list : [];
  if (!L.length) return T.fallback;
  for (const id of T.prefer) if (L.includes(id)) return id;
  const c = L.filter(n => T.match.test(n)).sort(cmpVer);
  if (c.length) return c[0];
  if (L.includes(T.fallback)) return T.fallback;
  const any = L.filter(n => /flash/.test(n)).sort(cmpVer);
  return any[0] || L[0];
}

const NUM_RE = '([0-9\u0660-\u0669][0-9\u0660-\u0669,，٬]*(?:[.٫][0-9\u0660-\u0669]+)?)';
const toLatinDigits = s => String(s).replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x660));
// numbers, prices and quantities stand out in every line, so a misheard 万 or a wrong digit is easy to spot
function hlNums(s) {
  s = String(s || '');
  const re = /[0-9\u0660-\u0669](?:[0-9\u0660-\u0669,.٫٬]*[0-9\u0660-\u0669])?(?:\s?[万千]|%)?/g;
  let out = '', last = 0, m;
  while ((m = re.exec(s))) { out += esc(s.slice(last, m.index)) + '<b class="num">' + esc(m[0]) + '</b>'; last = re.lastIndex; }
  return out + esc(s.slice(last));
}
function fxChips(x) {
  if (!S.showFx) return [];
  const rate = homePerLocal();
  if (!rate || (!isCN() && locCur() === S.cur)) return [];
  const text = (x.src || '') + '\n' + (x.tgt || '');
  const vals = [];
  const add = (s, mul) => {
    const v = parseNum(s) * (mul === '万' ? 1e4 : mul ? 1e3 : 1);
    if (v > 0 && v < 1e12 && !vals.includes(v)) vals.push(v);
  };
  let m;
  const lc = LOCALCUR[locCur()];
  const re1 = isCN() ? new RegExp(NUM_RE + '\\s*(万|千|k)?\\s*(?:元|块钱|块|蚊|yuans?|yuanes|rmb|cny|يوان|юан)', 'gi')
    : new RegExp(NUM_RE + '\\s*(k)?\\s*(?:' + lc.w + ')(?![a-z])', 'gi');
  const re2 = isCN() ? new RegExp('(?:¥|￥|rmb|cny)\\s*' + NUM_RE + '\\s*(万|千|k)?', 'gi')
    : new RegExp('(?:' + escRe(lc.s) + ')\\s*' + NUM_RE + '\\s*(k)?', 'gi');
  while ((m = re1.exec(text))) add(m[1], m[2]);
  while ((m = re2.exec(text))) add(m[1], m[2]);
  return vals.slice(0, 4).map(v => locSym() + smartN(v) + ' ≈ ' + money(v * rate, S.cur));
}

function parseOut(raw) {

async function streamRequest(model, body, onText, key) {
  const url = API + '/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse';
  const ctrl = new AbortController();
  let timer = 0;
  const arm = ms => { clearTimeout(timer); timer = setTimeout(() => ctrl.abort(), ms); };
  arm(25000);                                             // nothing at all within 25 s: the connection is stuck, don't wait a minute
  const t0 = performance.now(), payload = JSON.stringify(body);
  const perf = { up: Math.round(payload.length / 1024), ttfb: 0, first: 0, total: 0 };
  let res;

  } catch (e) {
    clearTimeout(timer);

  }
  arm(20000);

    for (;;) {

      if (done) break;
      arm(20000);

      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, '');
        buf = buf.slice(i + 1);

        const data = line.slice(5).trim();
        if (!data) continue;
        let j;
        try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.error) throw { status: j.error.code, message: j.error.message, detail: JSON.stringify(j.error.details || '') };
        if (j.usageMetadata) lastUsage = j.usageMetadata;

  try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wanted) requestWake();
  if (document.visibilityState === 'visible' && pocket.on) keepAwake(true);
  if (document.visibilityState === 'hidden' && rec.on) stopConvo('manual');
  if (document.visibilityState === 'hidden' && ptt.active) { holdReset(); if (ptt.opening || ptt.ms < 700) pttEnd(); else pttSend(); }
  if (document.visibilityState === 'visible') { checkNet(true); renderDestBar(); }
  if (document.visibilityState === 'hidden' && cam.on) stopCam();
});

function fitSize(text, big) {
  const n = Array.from(text || '').length;
  if (big) return n <= 4 ? '4.4rem' : n <= 8 ? '3.4rem' : n <= 12 ? '2.9rem' : n <= 24 ? '2.4rem' : n <= 48 ? '2rem' : n <= 100 ? '1.6rem' : '1.3rem';
  return n <= 12 ? '2.6rem' : n <= 28 ? '2.15rem' : n <= 60 ? '1.75rem' : n <= 120 ? '1.4rem' : '1.15rem';
}
function sellerCue() {
  if (!isCN()) { const c = CUE(); return { big: c.cue, small: c.cue2, rec: c.rec }; }
  const cmn = ZH() === 'cmn';
  return ptt.held ? { big: cmn ? '请稍等' : '等阵先', small: '', rec: '已暂停' } : { big: cmn ? '请说话' : '请讲', small: cmn ? '说完我会帮你翻译' : '讲完我会帮你翻译', rec: cmn ? '正在录音' : '录紧音' };
}

function convText(c) {
  const lines = ['ترجمان السفر · ' + c.title, fmtDate(c.created), ''];
  for (const x of c.turns) {
    if (x.pending) continue;
    const who = x.dir === 'out' ? t('conv_me') : t('conv_them');
    lines.push('[' + fmtTime(x.t) + '] ' + who + ' (' + langLabel(x.lang) + '): ' + x.src);
    lines.push('    → ' + x.tgt);
    if (x.jp) lines.push('    ' + x.jp);
    lines.push('');
  }
  return lines.join('\n');
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.append(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}
async function shareConv(c) {
  const text = convText(c);
  if (navigator.share) { try { await navigator.share({ title: c.title, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  toast(await copyText(text) ? t('t_conv_copied') : t('t_copy_fail'));
}
function downloadConv(c) {
  const blob = new Blob([convText(c)], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = c.title.replace(/[\\/:*?"<>|]/g, '-') + '.txt';
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

let phraseCat = 'all';
const norm = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');
function renderPhrases() {

  $('#phraseCats').innerHTML = cats.map(c => '<button class="cat" type="button" data-cat="' + c.id + '" aria-pressed="' + (c.id === phraseCat) + '">' + esc(c.name) + '</button>').join('');
  const q = norm($('#phraseSearch').value.trim());
  const groups = [];
  if (mine.length) groups.push({ id: 'mine', name: t('ph_mine'), items: mine });
  if (ready) PHRASES.forEach(g => groups.push({ id: g.id, name: t('cat_' + g.id), items: g.items.filter(phraseOK) }));

      : '<span>' + esc(t(hasKey() ? 'pk_prep_fail' : 'pk_prep_key', { l: localName() })) + '</span>' + (hasKey() ? '<button class="btn sm" type="button" id="packGo">' + esc(t('pk_prep_btn')) + '</button>' : '');
    list.append(w);
    const g = $('#packGo', w); if (g) g.addEventListener('click', () => ensurePack(true));
  }
  let shown = 0;
  for (const g of groups) {
    if (phraseCat !== 'all' && phraseCat !== g.id) continue;
    const items = g.items.filter(p => !q || norm([p.ar, p.en, p.yue, p.cmn, p.jy, p.py, p.label, p.zh, builtinZh(p).zh].join(' ')).includes(q));

      const lbl = p.zh ? '<bdi>' + esc(p.label) + '</bdi>' : (S.ui === 'ar' ? esc(p.ar) + ' <em>· <bdi dir="ltr">' + esc(p.en) + '</bdi></em>' : '<bdi>' + esc(p.en) + '</bdi>');
      const card = document.createElement('div');
      card.className = 'ph';
      card.innerHTML = '<button class="ph-main" type="button"><span class="zh" dir="ltr">' + esc(z.zh) + '</span>' + (z.rom ? '<span class="ph-rom">' + esc(z.rom) + '</span>' : '') + '<span class="ph-lbl">' + lbl + '</span></button>' +
        (p.zh ? '<button class="ph-side" type="button" aria-label="' + esc(t('ph_del')) + '"><svg class="ic"><use href="#i-trash"/></svg></button>'
              : '<button class="ph-side" type="button" aria-label="' + esc(t('card_speak')) + '"><svg class="ic"><use href="#i-speak"/></svg></button>');
      $('.ph-main', card).addEventListener('click', () => openPhrase(p));
      $('.ph-side', card).addEventListener('click', () => {
        if (p.zh) { store.set('phrases', myPhrases().filter(x => x.id !== p.id)); renderPhrases(); toast(t('ph_deleted')); }
        else { unlockAudio(); const zz = builtinZh(p); speak(zz.zh, zz.kind); }
      });
      grid.append(card);
      shown++;

    list.append(sec);
  }

async function refreshRates(silent) {
  const btn = $('#fxRefresh');
  btn.disabled = true;
  try {
    const res = await fetch(FX_API, { cache: 'no-store' });
    if (!res.ok) throw new Error('http');
    const j = await res.json();
    if (j.result !== 'success' || !j.rates) throw new Error('bad');
    const rates = {};
    Object.keys(CUR).concat(Object.keys(LOCALCUR)).forEach(c => { if (j.rates[c] > 0) rates[c] = j.rates[c]; });
    if (!rates.USD) throw new Error('bad');
    S.rates = rates; S.ratesAt = (j.time_last_update_unix ? j.time_last_update_unix * 1000 : Date.now()); S.rateSrc = 'live';
    saveSettings();
    if (!silent) toast(t('fx_upd_ok'));
  } catch (e) {
    if (!silent) toast(t('fx_upd_fail'), 'warn');
  } finally {
    btn.disabled = false;
    if (tab === 'tools' && S.tool === 'fx') renderFx();
    if (tab === 'talk' && current()) renderFeed();
  }
}
function maybeAutoRefresh() {
  if (S.rateSrc === 'manual') return;
  if (!S.ratesAt || Date.now() - S.ratesAt > 24 * 3600 * 1000) refreshRates(true);

function boxColors(b) {

function parseKeys(raw, keys) {
  const txt = String(raw || '').replace(/```[a-z]*/gi, '');
  const re = new RegExp('^[ \\t>*_-]*(' + keys.join('|') + ')[ \\t*_]*[:：][ \\t]*', 'gim');
  const marks = []; let m;
  while ((m = re.exec(txt))) marks.push({ k: m[1].toUpperCase(), start: m.index, vstart: re.lastIndex });
  const out = {};
  marks.forEach((mk, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].start : txt.length;
    const v = txt.slice(mk.vstart, end).replace(/\s*\n\s*/g, ' ').replace(/^[*_\s]+|[*_\s]+$/g, '').trim();
    if (!out[mk.k]) out[mk.k] = v;
  });
  return out;
}
async function callText(sys, user, maxOut, main) {
  if (!hasKey()) throw { code: 'nokey' };
  const model = taskModel(main);
  const base = { systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: user }] }], generationConfig: { maxOutputTokens: maxOut || 400 } };
  if (/gemini-2\./.test(model)) base.generationConfig.temperature = 0.3;
  let lastErr;
  for (const tc of thinkVariants(model)) {
    const body = JSON.parse(JSON.stringify(base));
    if (tc) body.generationConfig.thinkingConfig = tc;
    try {
      const { r: j, free } = await withKey(model, k => postJSON(model, body, k));
      store.set('think.' + model, tc);
      addUsage(j.usageMetadata, model, null, free);
      const cand = (j.candidates || [])[0];
      return ((cand && cand.content && cand.content.parts) || []).filter(p => p.text && !p.thought).map(p => p.text).join('').trim();
    } catch (e) {
      lastErr = e;
      if (e && e.status === 400 && /think/i.test(e.message || '')) continue;
      if (e && e.status === 404 && !main && model !== taskModel(true)) return callText(sys, user, maxOut, true);
      if (e && e.status === 404 && !S.modelManual) { try { await refreshModels(); } catch (x) {} }
      throw e;
    }
  }
  throw lastErr;
}

function fxInline(s) {

  while ((m = re.exec(s))) {

function setupPWA() {
  const base = location.href.split(/[?#]/)[0];
  const scope = base.replace(/[^/]*$/, '');
  const make = icons => {
    try {
      const m = { name: 'ترجمان السفر', short_name: 'ترجمان السفر', start_url: base, scope, display: 'standalone', orientation: 'portrait', background_color: '#0B2F28', theme_color: '#0B2F28', icons };
      const link = document.createElement('link');
      link.rel = 'manifest';
      link.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' }));
      document.head.append(link);
    } catch (e) {}
  };
  const ic = document.querySelector('link[rel="apple-touch-icon"]');
  if (ic && /^https?:/.test(location.protocol)) {
    const img = new Image();
    img.onload = () => {
      try {
        make([192, 512].map(n => { const cv = document.createElement('canvas'); cv.width = cv.height = n; cv.getContext('2d').drawImage(img, 0, 0, n, n); return { src: cv.toDataURL('image/png'), sizes: n + 'x' + n, type: 'image/png', purpose: 'any' }; }));
      } catch (e) { make([]); }
    };
    img.onerror = () => make([]);
    img.src = ic.href;
  }
  if ('serviceWorker' in navigator && window.isSecureContext) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!current()) renderFeed(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; store.set('instHide', true); if (!current()) renderFeed(); toast(t('inst_ok')); });
}

  $('#ctxReset').addEventListener('click', () => { S.context = ''; $('#ctxInput').value = ctxText(); saveSettings(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (ptt.active) { holdReset(); pttCancel(); return; }
      if (pocket.on) { stopPocket(); return; }
      if (!$('#shotOv').hidden) { closeShot(); return; }
      if (!$('#cardOv').hidden) closeCard();
      else if (!$('#scrim').hidden) closeSheets();
      else if (f2fOpen) closeF2F();
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (tab === 'usage' && !unlocked && !typing && $('#scrim').hidden) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); pressKey('del'); return; }
    }
    if (e.code === 'Space' && !e.repeat && tab === 'camera' && cam.on && !typing && $('#scrim').hidden) { e.preventDefault(); toggleFreeze(); return; }
    if (e.code === 'Space' && !e.repeat && tab === 'talk' && !typing && document.activeElement.tagName !== 'BUTTON' && $('#scrim').hidden && $('#cardOv').hidden) { e.preventDefault(); if (!ptt.active) { spaceHold = Date.now(); pttStart('me'); } }
  });
  document.addEventListener('keyup', e => {                // Space works like the button: hold to talk, let go to send
    if (e.code !== 'Space' || !spaceHold) return;
    const d = Date.now() - spaceHold; spaceHold = 0;
    if (!ptt.active) return;
    if (d < 450 || ptt.ms < 300) { pttEnd(); toast(t('p_short'), 'warn'); } else pttSend();
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === 'usage' && unlocked) drawChart(lastDays(14)); if (cam.on && cam.items.length) renderLabels(); if (!$('#shotOv').hidden) fitShot(); }, 150); });
}

function init() {
  if (currentId && !current()) currentId = null;
  saveSettings();
  applyI18n();
  buildWave();
  bind();
  renderTalkLabels();
  setupPWA();
  if (S.calc) { $('#cPrice').value = S.calc.p || ''; $('#cQty').value = S.calc.q || ''; }
  renderFeed();
  refreshStatus();
  const t0 = store.get('tab', 'talk');
  setTab(TABS.includes(t0) ? t0 : 'talk');
  if (/^#pocket/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} setTab('talk'); setTimeout(openPocketSheet, 300); }
  applyTheme(); renderDestBar(); if (!isCN()) setTimeout(() => { ensurePack(); if (!(S.rates && S.rates[locCur()])) refreshRates(true); }, 2500);
  renderNet(); setInterval(netTick, 10000); if (hasKey()) setTimeout(() => { if (!net.state && !net.busy) checkNet(true); }, 600);
  if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; } }
}

window.__yb = { applyTheme, lastPerfLog: () => store.get('perfLog', []), pttLock, DST, tzDest, setDest, phrasePack, ensurePack, homePerLocal, parseNum, net, failedQ, checkNet, hold, pocket, rec, ptt, trimSilence, speakQ, queueSpeak, freeFailKind, withKey, taskModel, freeUsable, laDay, parseShot, shotPrompt, shot, openShotFile, hlNums, parseKeys, summaryHtml, ZH, fxInline, rec, encodeMulawWavB64, linToMulaw, parseItems, visionPrompt, cam, parseOut, encodeWavB64, resolveTier, buildPrompt, fxChips, checkPin, priceOf, per1000USD, S };
init();
})();
