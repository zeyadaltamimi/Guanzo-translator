<style>
/* Layout: one-screen app. Header / active panel / bottom tab bar.
   Talk panel = scrolling conversation + docked single mic. Phrases, conversations and the PIN-locked usage tab scroll.
   Identity: Xiguan "Manchu window" stained glass (ruby, amber, cobalt, jade) set in a pale lattice. */
:root{
  --porcelain:#EEF3F0;
  --surface:#FFFFFF;
  --raised:#F5F8F6;
  --ink:#13201D;
  --ink-2:#55655F;
  --ink-3:#7F8E88;
  --line:#D6E0DB;
  --mine:#DFEEE7;
  --jade:#1E7A5B;
  --bar:#13855D;
  --amber:#D99A2B;
  --ruby:#B5343C;
  --cobalt:#2D5CA6;
  --rec:#C8402F;
  --lattice:#F7FAF8;
  --fx-bg:#FBF1DC;
  --fx-ink:#7A5410;
  --scrim:rgb(8 14 12 / .42);
  --shadow:0 1px 2px rgb(19 32 29 / .06), 0 8px 24px rgb(19 32 29 / .07);
  --font-ui:"IBM Plex Sans Arabic","SF Arabic","Geeza Pro","Noto Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-zh:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;
  --font-mark:"Noto Serif SC","Songti SC","STSong","Noto Serif CJK SC",serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --lvl:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --porcelain:#0D1614; --surface:#15211E; --raised:#1B2925; --ink:#E3ECE8; --ink-2:#97A9A2; --ink-3:#6F817A; --line:#24332F;
    --mine:#16302A; --jade:#4FB38D; --bar:#3AA67E; --amber:#E8B04A; --ruby:#D45A60; --cobalt:#7198DA; --rec:#E0604E;
    --lattice:#0D1614; --fx-bg:#2B2416; --fx-ink:#E8C27A; --scrim:rgb(0 0 0 / .55);
    --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --porcelain:#0D1614; --surface:#15211E; --raised:#1B2925; --ink:#E3ECE8; --ink-2:#97A9A2; --ink-3:#6F817A; --line:#24332F;
  --mine:#16302A; --jade:#4FB38D; --bar:#3AA67E; --amber:#E8B04A; --ruby:#D45A60; --cobalt:#7198DA; --rec:#E0604E;
  --lattice:#0D1614; --fx-bg:#2B2416; --fx-ink:#E8C27A; --scrim:rgb(0 0 0 / .55);
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 8px 24px rgb(0 0 0 / .28);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--porcelain);color:var(--ink);font:16px/1.55 var(--font-ui);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--cobalt)}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.zh{font-family:var(--font-zh)}
.gut{padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}

/* glass mark (the brand motif) */
.glass-sq{border-radius:8px;flex:none;
  background:
    linear-gradient(var(--lattice),var(--lattice)) center/2.5px 100% no-repeat,
    linear-gradient(var(--lattice),var(--lattice)) center/100% 2.5px no-repeat,
    conic-gradient(from 0deg,var(--amber) 0 25%,var(--jade) 0 50%,var(--cobalt) 0 75%,var(--ruby) 0);
  box-shadow:inset 0 0 0 2.5px var(--lattice),0 0 0 1px var(--line)}

.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.panels,.top,.tabbar{min-width:0}

/* Header */
.top{display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line);background:var(--porcelain)}
.top .glass-sq{width:32px;height:32px}
.brand-text{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
.brand-text h1{margin:0;font:700 13px/1.2 var(--font-mark);letter-spacing:.12em;color:var(--ink-2)}
.sub{border:0;background:none;padding:2px 0 0;font-size:17px;font-weight:600;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:flex;align-items:center;gap:6px}
.sub .ic{width:15px;height:15px;color:var(--ink-3)}
.sub:disabled{cursor:default}
.sub:disabled .ic{display:none}
.icon-btn{width:42px;height:42px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--line)}

.panels{min-height:0;position:relative}
.panel{height:100%;min-height:0}
.panel.talk{display:grid;grid-template-rows:minmax(0,1fr) auto}
.panel.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pane{display:flex;flex-direction:column;gap:14px;padding-block:16px 28px;max-width:760px;margin:0 auto;width:100%;min-width:0}
.pane>*,.hist>*,.conv>*,.ph-group,.ph-grid>*,.stack>*{min-width:0}

/* Tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);padding-left:env(safe-area-inset-left,0px)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;color:var(--ink-3);position:relative}
.tab .tab-ic{position:relative;width:46px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"] .tab-ic{background:var(--mine);color:var(--jade)}
.tab .lock-badge{position:absolute;bottom:0;inset-inline-end:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.tab .lock-badge .ic{width:11px;height:11px;stroke-width:2.2}

/* Feed */
.feed{overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding-block:16px 20px}
.turn{max-width:min(92%,620px);min-width:0;padding:8px 14px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;animation:pop .22s ease-out}
.turn.mine{align-self:flex-start;background:var(--mine);border-color:transparent;border-start-start-radius:6px}
.turn.theirs{align-self:flex-end;border-start-end-radius:6px}
@keyframes pop{from{transform:translateY(6px);opacity:.4}}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);min-height:34px}
.chip{font-weight:600;letter-spacing:.02em;padding:2px 9px;border-radius:99px;background:var(--porcelain);white-space:nowrap}
.turn.mine .chip{background:var(--surface)}
.meta time{font-variant-numeric:tabular-nums;white-space:nowrap}
.acts{margin-inline-start:auto;display:flex;gap:0}
.mini{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--ink-2);display:grid;place-items:center}
.mini .ic{width:19px;height:19px}
.mini:active{background:var(--line)}
.mini:disabled{opacity:.35}
.src{margin:0;font-size:.95rem;color:var(--ink-2);overflow-wrap:anywhere}
.tgt{margin:0;font-size:1.3rem;line-height:1.45;font-weight:500;overflow-wrap:anywhere}
.turn.mine .tgt{font-size:1.65rem;line-height:1.4}
.jp{margin:2px 0 0;font:500 .85rem/1.5 var(--font-mono);color:var(--jade);direction:ltr;text-align:left;overflow-wrap:anywhere}
.fx{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.fx span{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--fx-bg);color:var(--fx-ink);font-variant-numeric:tabular-nums;direction:ltr}
.dots{display:inline-flex;gap:5px;padding:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);opacity:.35;animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1}}

/* Empty states */
.empty{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:19px;font-weight:700;text-wrap:balance}
.card p{margin:0;font-size:14.5px;color:var(--ink-2)}
.steps{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 12px;counter-increment:st}
.steps li::before{content:counter(st);grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--porcelain);display:grid;place-items:center;font-weight:700;font-size:14px}
.steps li.done::before{content:"✓";background:var(--jade);color:#fff}
.steps b{font-size:15px}
.steps span{font-size:13.5px;color:var(--ink-2)}
.steps .row{margin-top:4px}
.ready{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px 4px}
.ready .glass-sq{width:52px;height:52px;border-radius:14px;margin-bottom:4px}
.ready h2{margin:0;font-size:20px}
.ready p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:34ch;text-wrap:balance}
.label{margin:8px 0 0;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:start;max-width:100%}
.qchip .zh{font-size:17px;font-weight:600}
.qchip small{font-size:12px;color:var(--ink-2)}
.empty .turn{opacity:.85;animation:none}
.linkbtn{border:0;background:none;color:var(--cobalt);font-weight:600;padding:6px 0;text-align:start;font-size:14.5px}

/* Dock */
.dock{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:10px 12px;border-top:1px solid var(--line);background:var(--porcelain)}
.dock-top{min-height:34px;display:flex;align-items:center;justify-content:center;width:100%}
.mode{display:flex;gap:3px;padding:3px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.mode label{position:relative}
.mode input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.mode span{display:flex;align-items:center;gap:6px;padding:5px 13px;border-radius:99px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.mode span .ic{width:16px;height:16px}
.mode input:checked+span{background:var(--ink);color:var(--porcelain);font-weight:600}
.mode input:focus-visible+span{outline:2px solid var(--cobalt)}
.live{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2)}
.live .rdot{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1s infinite}
.live time{font-variant-numeric:tabular-nums;font-weight:700;color:var(--rec);min-width:38px;text-align:center;direction:ltr}
.wave{display:flex;align-items:center;gap:3px;height:24px;direction:ltr}
.wave i{width:3px;border-radius:2px;background:var(--rec);height:4px;transition:height .08s linear}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--jade);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dock-row{display:flex;align-items:center;justify-content:center;gap:34px}
.side{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.side[aria-pressed="true"]{background:var(--ink);color:var(--porcelain);border-color:var(--ink)}
.side:active{filter:brightness(.95)}

/* The mic: a Manchu-window glass ring around an ink disc */
.mic{position:relative;width:96px;height:96px;border-radius:50%;border:0;padding:0;background:none;flex:none;touch-action:manipulation}
.mic .glass{position:absolute;inset:0;border-radius:50%;
  background:
    linear-gradient(var(--lattice),var(--lattice)) center/3px 100% no-repeat,
    linear-gradient(var(--lattice),var(--lattice)) center/100% 3px no-repeat,
    radial-gradient(circle,transparent 0 69%,var(--lattice) 69.5% 72%,transparent 72.5%),
    conic-gradient(from 0deg,var(--amber) 0 25%,var(--jade) 0 50%,var(--cobalt) 0 75%,var(--ruby) 0);
  transform:scale(var(--lvl));transition:transform .09s linear}
.mic .disc{position:absolute;inset:14px;border-radius:50%;background:var(--ink);color:var(--porcelain);display:grid;place-items:center;box-shadow:0 0 0 3px var(--lattice);transition:background .2s}
.mic .disc .ic{width:32px;height:32px;stroke-width:2}
.mic .i-stop{display:none}
body[data-rec="1"] .mic .disc{background:var(--rec);color:#fff}
body[data-rec="1"] .mic .i-mic{display:none}
body[data-rec="1"] .mic .i-stop{display:block}
body[data-rec="1"] .mic .glass{animation:turn 7s linear infinite}
@keyframes turn{to{rotate:360deg}}
.mic:active .disc{filter:brightness(1.15)}
.type-row{display:flex;flex-direction:column;gap:6px;width:100%;max-width:660px}
.type-line{display:flex;gap:8px}
.type-line input{flex:1;min-width:0;height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.edit-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.edit-note button{border:0;background:none;color:var(--ruby);font-weight:600;padding:2px 4px}
.send{width:48px;height:48px;border-radius:14px;border:0;background:var(--ink);color:var(--porcelain);display:grid;place-items:center;flex:none}
[dir="rtl"] .send .ic{transform:scaleX(-1)}

/* Generic controls */
.row{display:flex;gap:8px;align-items:center}
.inp{width:100%;min-width:0;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:0 12px}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;line-height:1.5;resize:vertical;direction:ltr;text-align:left;font-size:14px}
.ltr{direction:ltr;text-align:left;font-family:var(--font-mono);font-size:14px}
.btn{height:46px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:var(--porcelain);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.btn.ghost{background:var(--raised);color:var(--ink);border:1px solid var(--line)}
.btn.sm{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.sm .ic{width:18px;height:18px}
.btn.danger{color:var(--ruby)}
.btn.danger[data-confirm]{background:var(--ruby);color:#fff;border-color:var(--ruby)}
.btn:disabled{opacity:.55}
.state{font-size:13px;margin:0;color:var(--ink-2)}
.state[data-tone="ok"]{color:var(--jade);font-weight:600}
.state[data-tone="err"]{color:var(--ruby);font-weight:600}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.search .ic{color:var(--ink-3);width:19px;height:19px}
.search input{border:0;background:none;flex:1;min-width:0;height:100%;outline:none}
.muted{color:var(--ink-2);font-size:14px;margin:8px 0;text-align:center}

/* Phrases */
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.cats::-webkit-scrollbar{display:none}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:13.5px;white-space:nowrap;color:var(--ink-2)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--porcelain);border-color:var(--ink);font-weight:600}
.ph-group{display:flex;flex-direction:column;gap:8px}
.ph-group h3{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.03em}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px}
.ph{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.ph-main{flex:1;min-width:0;border:0;background:none;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start}
.ph-main .zh{font-size:21px;font-weight:600;line-height:1.35}
.ph-rom{font:500 12.5px/1.4 var(--font-mono);color:var(--jade);direction:ltr}
.ph-lbl{font-size:13.5px;color:var(--ink-2)}
.ph-lbl em{font-style:normal;color:var(--ink-3)}
.ph-side{border:0;background:none;color:var(--ink-3);width:46px;display:grid;place-items:center;border-inline-start:1px solid var(--line)}
.ph-side .ic{width:19px;height:19px}
.ph-main:active,.ph-side:active{background:var(--raised)}

/* History */
.hist{display:flex;flex-direction:column;gap:10px}
.conv{border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.conv.on{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.conv-top{display:flex;align-items:center;gap:8px}
.conv-name{border:0;background:none;padding:0;font-size:16.5px;font-weight:600;flex:1;min-width:0}
.conv-name:focus{outline:none;border-bottom:1px solid var(--jade)}
.badge-now{font-size:11.5px;font-weight:600;color:var(--jade);background:var(--mine);padding:2px 8px;border-radius:99px;white-space:nowrap}
.conv-meta{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.conv-prev{font-size:14px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

/* Usage lock */
.lock{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0 8px;text-align:center}
.lock .glass-sq{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.lock .glass-sq span{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--porcelain);display:grid;place-items:center}
.lock .glass-sq .ic{width:16px;height:16px;stroke-width:2.2}
.lock h2{margin:6px 0 0;font-size:20px}
.lock p{margin:0;color:var(--ink-2);font-size:14px}
.pin-dots{display:flex;gap:14px;direction:ltr;margin:10px 0 2px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots i.on{background:var(--ink);border-color:var(--ink)}
.pin-dots.bad{animation:shake .35s}
.pin-dots.bad i{border-color:var(--ruby)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:12px 22px;direction:ltr;margin-top:8px}
.key{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;display:grid;place-items:center}
.key:active{background:var(--line)}
.key.ghost{border:0;background:none}
.key .ic{width:26px;height:26px}

/* Usage dashboard */
.u-hero{display:flex;flex-direction:column;gap:2px;padding:4px 2px}
.u-hero .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
.u-hero b{font-size:40px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.u-hero b small{font-size:15px;font-weight:500;color:var(--ink-2);margin-inline-start:6px}
.u-hero .cost{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.u-cells{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.u-cell{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.u-cell span{font-size:12px;color:var(--ink-2);font-weight:600}
.u-cell b{font-size:19px;font-variant-numeric:tabular-nums;font-weight:700}
.u-cell small{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.u-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.u-card h3{margin:0;font-size:15px;font-weight:600}
.u-card .sub2{font-size:12.5px;color:var(--ink-2);margin-top:-6px}
.chart{position:relative;min-height:170px}
.chart svg{display:block;width:100%;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink-3);stroke-width:1}
.chart .axis{fill:var(--ink-3);font:11px var(--font-ui);font-variant-numeric:tabular-nums}
.chart .axis.now{fill:var(--ink);font-weight:700}
.chart .val{fill:var(--ink);font:600 11px var(--font-ui);font-variant-numeric:tabular-nums}
.chart .bar{fill:var(--bar)}
.chart .hit{fill:transparent}
.chart .hit:hover+.bar,.chart .bar.sel{opacity:.8}
.tip{position:absolute;top:0;transform:translate(-50%,-100%);background:var(--ink);color:var(--porcelain);font-size:12px;line-height:1.45;padding:6px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums;z-index:2}
.u-list{display:flex;flex-direction:column}
.u-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.u-row:first-child{border-top:0}
.u-row b{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-row span{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.u-row .num{text-align:end;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;text-align:end;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--ink-2);font-weight:600}
details summary{cursor:pointer;color:var(--cobalt);font-size:13.5px;font-weight:600}
.note{margin:0;font-size:12.5px;color:var(--ink-2)}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:90;width:min(92vw,520px);background:var(--ink);color:var(--porcelain);padding:12px 16px;border-radius:14px;font-size:14px;box-shadow:var(--shadow);text-align:center;animation:drop .2s ease-out}
.toast[data-tone="err"]{background:var(--ruby);color:#fff}
.toast[data-tone="warn"]{background:var(--amber);color:#1b1408}
@keyframes drop{from{transform:translate(-50%,-8px);opacity:0}}

/* Sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:90dvh;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgb(0 0 0 / .18);padding-top:6px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-left:max(18px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 10px}
.sheet-head h2{margin:0;font-size:19px;font-weight:700}
.stack{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.group:last-of-type{border-bottom:0}
.group h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-size:13.5px;font-weight:600;color:var(--ink)}
.seg{display:flex;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg label{flex:1;position:relative;min-width:0}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;text-align:center;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.seg input:checked+span{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.seg input:focus-visible+span{outline:2px solid var(--cobalt)}
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:12px}
.tier input{margin:0;width:20px;height:20px;accent-color:var(--jade);grid-row:span 2}
.tier b{font-size:15px}
.tier .rec{font-size:11.5px;font-weight:700;color:var(--jade);background:var(--mine);padding:2px 8px;border-radius:99px;margin-inline-start:6px}
.tier .price{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;text-align:end;white-space:nowrap}
.tier small{grid-column:2 / 4;font-size:12.5px;color:var(--ink-2)}
.tier code{font:11.5px var(--font-mono);color:var(--ink-3);direction:ltr;display:inline-block}
.tier:has(input:checked){border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade);background:var(--surface)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:28px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgb(0 0 0 / .25);transition:inset-inline-start .2s}
.switch input:checked{background:var(--jade)}
.switch input:checked::after{inset-inline-start:23px}
.fx-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.fx-row input{width:110px;height:40px;text-align:center}
.foot{font-size:12px;color:var(--ink-3);text-align:center;margin:6px 0 0}
.menu{display:flex;flex-direction:column;padding:4px 0}
.menu button{border:0;background:none;display:flex;align-items:center;gap:14px;padding:14px 4px;font-size:16px;text-align:start;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button .ic{color:var(--ink-2)}
.menu button.danger,.menu button.danger .ic{color:var(--ruby)}
.menu-head{font-size:13.5px;color:var(--ink-2);padding:2px 4px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Face to face */
.f2f{position:fixed;inset:0;z-index:40;background:var(--porcelain);display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr)}
.half{display:flex;flex-direction:column;justify-content:center;gap:10px;overflow-y:auto;padding-top:20px;padding-right:max(22px,env(safe-area-inset-right,0px));padding-left:max(22px,env(safe-area-inset-left,0px))}
.half.them{transform:rotate(180deg);background:var(--surface);padding-bottom:calc(22px + env(safe-area-inset-top,0px))}
.half.me{padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.half-lbl{font-size:12.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-2)}
.half-txt{margin:0;font-weight:500;line-height:1.35;overflow-wrap:anywhere;text-wrap:balance}
.half.them .half-lbl,.half.them .half-txt{direction:ltr;text-align:left}
.seam{display:flex;align-items:center;justify-content:center;gap:30px;padding:10px 16px;border-block:1px solid var(--line);background:var(--porcelain)}
.seam .mic{width:88px;height:88px}
.seam .mic .disc{inset:13px}

/* Show card (big text for the supplier) */
.cardov{position:fixed;inset:0;z-index:60;background:var(--surface);display:grid;grid-template-rows:minmax(0,1fr) auto}
.cardov-body{display:flex;flex-direction:column;justify-content:center;gap:16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:16px;padding-right:max(24px,env(safe-area-inset-right,0px));padding-left:max(24px,env(safe-area-inset-left,0px));overflow-y:auto;transition:transform .35s ease}
.cardov-body.flip{transform:rotate(180deg)}
.cardov-big{margin:0;font-weight:600;line-height:1.3;overflow-wrap:anywhere;text-wrap:balance}
.cardov-rom{margin:0;font:500 1.05rem/1.5 var(--font-mono);color:var(--jade);direction:ltr}
.cardov-body>*{text-align:center}
.cardov-small{margin:0;font-size:1.05rem;color:var(--ink-2)}
.cardov-bar{display:flex;align-items:center;justify-content:center;gap:30px;padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--porcelain)}
.speakbig{width:76px;height:76px;border-radius:50%;border:0;background:var(--ink);color:var(--porcelain);display:grid;place-items:center}
.speakbig .ic{width:30px;height:30px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
}
@media (min-width:760px){
  .feed{padding-inline:max(24px,calc((100vw - 780px)/2))}
}

/* ---- v3 additions ---- */
.tabbar{grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{font-size:11px}
.tab .tab-ic{width:42px}
.dock-top{gap:8px}
.vchip{height:36px;min-width:36px;padding:0 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex:none}
.vchip .ic{width:18px;height:18px}
.vchip[aria-pressed="true"]{background:var(--mine);border-color:transparent;color:var(--jade)}
.vchip .on,.vchip[aria-pressed="true"] .off{display:none}
.vchip[aria-pressed="true"] .on{display:block}
.tseg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tseg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.tseg button .ic{width:18px;height:18px}
.tseg button[aria-selected="true"]{background:var(--ink);color:var(--porcelain);font-weight:600}
.tool{display:flex;flex-direction:column;gap:12px}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big-inp{height:58px;font-size:24px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;border-radius:14px}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qchips button{border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:5px 12px;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.calc-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.calc-out>div{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.calc-out span{font-size:12.5px;color:var(--ink-2);font-weight:600}
.calc-out b{font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;overflow-wrap:anywhere}
.calc-out small{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.calc-out .main{grid-column:1 / -1;background:var(--mine);border-color:transparent}
.calc-out .main b{font-size:36px;color:var(--ink)}
.fx-pair{display:flex;flex-direction:column;gap:6px}
.fx-in{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.fx-in span{font-size:13px;color:var(--ink-2);font-weight:600;grid-column:1 / -1}
.fx-in input{border:0;background:none;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;min-width:0;width:100%;outline:none;padding:0}
.fx-in b{font-size:17px;color:var(--ink-2)}
.fx-in:focus-within{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.fx-swap{align-self:center;color:var(--ink-3);display:grid;place-items:center;height:18px}
.fx-swap .ic{width:18px;height:18px}
.rate-line{font-size:13.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;margin:0}
.ref-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.ref-grid div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.ref-grid div span:first-child{color:var(--ink-2);direction:ltr}
.ref-grid div span:last-child{font-weight:600;direction:ltr}
.pl-list{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;min-width:0}
.pl-main{flex:1;min-width:0;border:0;background:none;padding:12px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:start}
.pl-zh{font-size:20px;font-weight:600;line-height:1.35}
.pl-name{font-size:14px;color:var(--ink)}
.pl-addr{font-size:13px;color:var(--ink-3)}
.pl-acts{display:flex;flex-direction:column;border-inline-start:1px solid var(--line)}
.pl-acts>*{flex:1;width:48px;min-height:40px;border:0;background:none;color:var(--ink-3);display:grid;place-items:center}
.pl-acts>*+*{border-top:1px solid var(--line)}
.pl-acts .ic{width:19px;height:19px}
.pl-main:active,.pl-acts>*:active{background:var(--raised)}
.hint-card{display:flex;align-items:center;gap:12px;background:var(--mine);border-radius:16px;padding:12px 14px;font-size:14px}
.hint-card .ic{color:var(--jade);width:24px;height:24px}
.cardov-top{margin:0;font-size:1.25rem;font-weight:600;color:var(--ink-2)}
.cardov-mid{margin:0;font-size:1.6rem;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.sub-opts{display:flex;flex-direction:column;gap:14px;padding-inline-start:14px;border-inline-start:2px solid var(--line)}
.switch small{display:block;font-size:12.5px;color:var(--ink-2);font-weight:400;margin-top:2px}
.switch>span{min-width:0}
.test-row{display:flex;flex-wrap:wrap;gap:8px}
select.inp{appearance:auto}

.panel.talk{grid-template-columns:minmax(0,1fr)}
.dock-top{flex-wrap:wrap;row-gap:6px;max-width:100%}
.mode label>span{padding:5px 11px}
.mode label>span span{display:inline;padding:0;color:inherit;background:none;border-radius:0}
@media (max-width:380px){.mode label>span .ic{display:none}}

.seg label>span span{display:inline;padding:0;background:none;box-shadow:none;font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.dock-top{flex-wrap:nowrap}

/* ---- v4: live camera ---- */
:root{--lb-bg:rgb(255 255 255 / .94);--lb-ink:#13201D;--warn:#C62F2F;--caution:#B7791F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lb-bg:rgb(255 255 255 / .94);--lb-ink:#13201D;--warn:#E25555;--caution:#E0A23A}}
:root[data-theme="dark"]{--lb-bg:rgb(255 255 255 / .94);--lb-ink:#13201D;--warn:#E25555;--caution:#E0A23A}
.panel.cam{display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr)}
.cam-stage{position:relative;overflow:hidden;background:#0B100F;min-height:0}
.cam-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0B100F}
.cam-reticle{position:absolute;inset:16% 10%;pointer-events:none;opacity:.75;transition:opacity .3s}
.cam-reticle i{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:3px}
.cam-reticle i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
.cam-reticle i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam-reticle i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
.cam-reticle i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cam-stage[data-reading="1"] .cam-reticle i{border-color:var(--amber);animation:blink 1s infinite}
.cam-stage[data-has="1"] .cam-reticle{opacity:0}
.cam-labels{position:absolute;inset:0;transition:opacity .25s}
.cam-labels[data-state="dim"]{opacity:.3}
.cam-labels[data-state="off"]{opacity:0;pointer-events:none}
.lb{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:3px 7px 4px;border-radius:7px;border:0;background:var(--lb-bg);color:var(--lb-ink);box-shadow:0 2px 10px rgb(0 0 0 / .28);font-weight:600;line-height:1.25;text-align:start;animation:pop .2s ease-out;overflow-wrap:anywhere}
.lb-t{display:block}
.lb-p{font-size:.78em;font-weight:700;color:#7A5410;font-variant-numeric:tabular-nums;direction:ltr}
.lb-h{font-size:.72em;font-weight:700;color:#fff;background:var(--caution);border-radius:5px;padding:1px 6px;margin-top:2px}
.lb.warn{box-shadow:0 0 0 2.5px var(--warn),0 2px 10px rgb(0 0 0 / .3)}
.lb.warn .lb-h{background:var(--warn)}
.lb.caution{box-shadow:0 0 0 2px var(--caution),0 2px 10px rgb(0 0 0 / .3)}
.cam-top{position:absolute;top:12px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3;padding-inline:16px}
.cam-top>*{pointer-events:auto}
.cam-mode{display:flex;gap:3px;padding:3px;border-radius:99px;background:rgb(10 16 14 / .62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cam-mode label{position:relative}
.cam-mode input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.cam-mode label>span{display:block;padding:6px 14px;border-radius:99px;font-size:13.5px;color:rgb(255 255 255 / .85);white-space:nowrap}
.cam-mode input:checked+span{background:#fff;color:#13201D;font-weight:700}
.cam-mode input:focus-visible+span{outline:2px solid var(--amber)}
.cam-status{display:flex;align-items:center;gap:8px;background:rgb(10 16 14 / .62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:13.5px;padding:6px 14px;border-radius:99px;max-width:100%;text-align:center}
.cam-status .spin{border-color:rgb(255 255 255 / .3);border-top-color:#fff}
.cam-status[data-tone="err"]{background:rgb(160 30 30 / .85)}
.cam-start{position:absolute;inset:0;z-index:2;background:var(--porcelain);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-top:64px;padding-bottom:20px;overflow-y:auto}
.cam-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center}
.cam-mark>span{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--porcelain);display:grid;place-items:center}
.cam-mark .ic{width:20px;height:20px}
.cam-start h2{margin:4px 0 0;font-size:22px}
.cam-lead{margin:0;color:var(--ink-2);font-size:15px;max-width:34ch;text-wrap:balance}
.cam-steps{list-style:none;margin:4px 0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:start}
.cam-steps li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.cam-steps .ic{color:var(--jade);width:20px;height:20px}
.cam-go{height:54px;padding:0 28px;font-size:16.5px;border-radius:16px;margin-top:4px}
.cam-note{max-width:36ch;text-align:center}
.cam-bar{display:flex;align-items:center;justify-content:center;gap:34px;padding-block:10px 12px;background:var(--porcelain);border-top:1px solid var(--line)}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid var(--ink);background:var(--surface);color:var(--ink);display:grid;place-items:center}
.shutter .ic{width:28px;height:28px}
.shutter .i-play{display:none}
.shutter[aria-pressed="true"]{background:var(--ink);color:var(--porcelain)}
.shutter[aria-pressed="true"] .i-play{display:block}
.shutter[aria-pressed="true"] .i-pause{display:none}
.it{gap:10px}
.it-zh{margin:0;font-size:28px;font-weight:700;line-height:1.3}
.it-t{margin:0;font-size:20px;font-weight:600;line-height:1.35}
.it-e{margin:0;color:var(--ink-2);font-size:15px}
.it-flag{margin:0;font-weight:700;font-size:14px;padding:8px 12px;border-radius:12px;color:#fff;background:var(--warn)}
.it-flag.caution{background:var(--caution)}
.it-price{margin:0;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.it-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.it-acts .btn{padding:0 10px;font-size:14px}
.items-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;width:100%}
.items-row .zh{font-size:17px;font-weight:600}
.items-row span{font-size:14.5px}
.items-row em{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--warn);border-radius:5px;padding:1px 6px}
.items-row em.caution{background:var(--caution)}

.cam-status{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:3;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}

/* ---- v4.1: press and hold to talk ---- */
.mic{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .15s ease}
body[data-hold="1"] .mic{transform:scale(1.1)}
body[data-hold="cancel"] .mic{transform:scale(.94)}
body[data-hold="cancel"] .mic .disc{background:var(--ink-3)}
body[data-hold="cancel"] .live{color:var(--ruby);font-weight:600}
.ready-hold{display:flex;align-items:flex-start;gap:8px;margin:6px 0 0;padding:10px 12px;border-radius:14px;background:var(--mine);color:var(--ink);font-size:14px;text-align:start;max-width:40ch}
.ready-hold .ic{color:var(--jade);width:20px;height:20px;flex:none;margin-top:1px}
</style>
</head>

<div class="app">
  <header class="top gut">
    <span class="glass-sq" aria-hidden="true"></span>
    <div class="brand-text">
      <h1>粤桥</h1>
      <button class="sub" id="subTitle" type="button"><span id="subText"></span><svg class="ic"><use href="#i-pen"/></svg></button>

    <button class="icon-btn" id="newBtn" type="button" data-i18n-aria="new_conv"><svg class="ic"><use href="#i-plus"/></svg></button>
    <button class="icon-btn" id="setBtn" type="button" data-i18n-aria="settings"><svg class="ic"><use href="#i-gear"/></svg></button>
  </header>

  <main class="panels">
    <!-- Talk -->

      <footer class="dock gut">
        <div class="dock-top">
          <div class="mode" id="modeBar" role="radiogroup" data-i18n-aria="mode_aria">

            <label><input type="radio" name="recMode" value="auto" id="rm-auto"><span><svg class="ic"><use href="#i-wave"/></svg><span data-i18n="mode_auto"></span></span></label>
          </div>
          <div class="live" id="live" hidden>
            <span class="rdot" id="liveDot"></span>
            <span class="spin" id="liveSpin"></span>
            <time id="liveTime">0:00</time>
            <span class="wave" id="wave" aria-hidden="true"></span>
            <span id="liveText"></span>
          </div>
          <button class="vchip" id="voiceBtn" type="button" aria-pressed="true"><svg class="ic on"><use href="#i-speak"/></svg><svg class="ic off"><use href="#i-mute"/></svg></button>
        </div>
        <div class="dock-row">
          <button class="side" id="kbBtn" type="button" data-i18n-aria="kb_aria" aria-pressed="false"><svg class="ic"><use href="#i-kb"/></svg></button>
          <button class="mic" id="micBtn" type="button">

            <button class="send" type="submit" data-i18n-aria="send_aria"><svg class="ic"><use href="#i-send"/></svg></button>
          </div>
        </form>
      </footer>
    </section>

    <!-- Camera -->

        <div class="cam-reticle" id="camReticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="cam-labels" id="camLabels"></div>

        <div id="phraseList" class="stack"></div>
        <p class="note" data-i18n="ph_note"></p>
      </div>
    </section>

    <!-- Tools -->
    <section class="panel scroll" data-panel="tools" id="panel-tools" role="tabpanel" aria-labelledby="tab-tools" hidden>
      <div class="pane gut">
        <div class="tseg" role="tablist" id="toolSeg">
          <button type="button" role="tab" data-tool="calc" id="tt-calc"><svg class="ic"><use href="#i-calc"/></svg><span data-i18n="tools_calc"></span></button>
          <button type="button" role="tab" data-tool="fx" id="tt-fx"><svg class="ic"><use href="#i-coin"/></svg><span data-i18n="tools_fx"></span></button>
          <button type="button" role="tab" data-tool="taxi" id="tt-taxi"><svg class="ic"><use href="#i-car"/></svg><span data-i18n="tools_taxi"></span></button>
        </div>

        <!-- Calculator -->
        <div class="tool" id="tool-calc" role="tabpanel">
          <section class="u-card">
            <div class="calc-grid">
              <label class="field" for="cPrice"><span class="lbl" data-i18n="calc_price"></span><input class="inp big-inp" id="cPrice" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
              <label class="field" for="cQty"><span class="lbl" data-i18n="calc_qty"></span><input class="inp big-inp" id="cQty" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
            </div>
            <div class="qchips" id="qtyChips"></div>
            <div class="calc-out">
              <div class="main"><span data-i18n="calc_total"></span><b id="cTotal">¥0</b><small id="cTotalHome"></small></div>
              <div><span data-i18n="calc_unit_home"></span><b id="cUnitHome">—</b></div>

const PRICE_TABLE = [
  [/^gemini-2\.5-flash-lite/, { t: 0.10, a: 0.30, o: 0.40 }],
  [/^gemini-3\.1-flash-lite/, { t: 0.25, a: 0.50, o: 1.50 }],
  [/^gemini-3\.5-flash-lite/, { t: 0.30, a: 0.30, o: 2.50 }],
  [/flash-lite/, { t: 0.30, a: 0.30, o: 2.50 }],
  [/^gemini-2\.5-flash/, { t: 0.30, a: 1.00, o: 2.50 }],
  [/flash/, { t: 0.75, a: 0.75, o: 3.75 }],
  [/pro/, { t: 2.00, a: 2.00, o: 12.00 }]
];
function priceOf(model) { for (const [re, p] of PRICE_TABLE) if (re.test(model || '')) return p; return { t: 0.75, a: 0.75, o: 3.75 }; }
// a typical spoken turn: ~520 prompt text tokens, ~160 audio tokens (5 s), ~90 output tokens
const per1000USD = model => { const p = priceOf(model); return (520 * p.t + 160 * p.a + 90 * p.o) / 1e6 * 1000; };
const per1000Text = model => { const u = per1000USD(model); const h = S.cur === 'USD' ? null : usdToHome(u); return h != null ? money(h, S.cur) : fmtUSD(u); };
const TIERS = [
  { id: 'eco', prefer: ['gemini-3.1-flash-lite', 'gemini-3.5-flash-lite', 'gemini-flash-lite-latest'], match: /^gemini-\d+(\.\d+)?-flash-lite$/, fallback: 'gemini-3.1-flash-lite', recommended: true },
  { id: 'bal', prefer: [], match: /^gemini-\d+(\.\d+)?-flash-lite$/, fallback: 'gemini-flash-lite-latest' },
  { id: 'best', prefer: [], match: /^gemini-\d+(\.\d+)?-flash$/, fallback: 'gemini-flash-latest' }
];
function verOf(id) { const m = String(id).match(/^gemini-(\d+)(?:\.(\d+))?-/); return m ? [+m[1], +(m[2] || 0)] : [0, 0]; }
function cmpVer(a, b) { const x = verOf(a), y = verOf(b); return (y[0] - x[0]) || (y[1] - x[1]); }
function resolveTier(tierId, list) {
  const T = TIERS.find(x => x.id === tierId) || TIERS[0];
  const L = Array.isArray(list) ? list : [];
  if (!L.length) return T.fallback;
  for (const id of T.prefer) if (L.includes(id)) return id;
  const c = L.filter(n => T.match.test(n)).sort(cmpVer);
  if (c.length) return c[0];
  if (L.includes(T.fallback)) return T.fallback;
  const any = L.filter(n => /flash/.test(n)).sort(cmpVer);
  return any[0] || L[0];
}

function fxChips(x) {
  if (!S.showFx) return [];
  const rate = rateOf(S.cur);
  if (!rate) return [];
  const text = (x.src || '') + '\n' + (x.tgt || '');
  const vals = [];
  const add = s => { const v = parseFloat(String(s).replace(/,/g, '')); if (v > 0 && v < 1e9 && !vals.includes(v)) vals.push(v); };
  let m;
  const re1 = /(\d[\d,]*(?:\.\d+)?)\s*(?:元|块钱|块|蚊|yuan|rmb|cny)/gi;
  const re2 = /(?:¥|￥|rmb|cny)\s*(\d[\d,]*(?:\.\d+)?)/gi;
  while ((m = re1.exec(text))) add(m[1]);
  while ((m = re2.exec(text))) add(m[1]);
  return vals.slice(0, 4).map(v => '¥' + smartN(v) + ' ≈ ' + money(v * rate, S.cur));
}

function buildPrompt(history) {
  const my = LANG[S.myLang].en;
  const zh = S.zhStyle === 'cmn'
    ? 'standard Mandarin (Simplified characters)'
    : 'natural spoken Guangzhou Cantonese (广州话) in Simplified characters with Cantonese colloquial words (嘅 唔 系 咗 啲 嚟 冇 佢 喺 咁 乜嘢 几多 边度 而家 畀); never Mandarin wording';
  const L = [
    'You are a live interpreter at a wholesale market in Guangzhou.',
    'A = a foreign visitor who speaks ' + my + (S.myLang !== 'en' ? ' or English' : '') + '. B = a local merchant who speaks Guangzhou Cantonese (sometimes Mandarin).',
    'For each turn (audio or typed):',
    'LANG = language actually spoken, as an ISO 639-1 code (en, ar, fr, ru…), or yue for Cantonese, cmn for Mandarin, none for no clear speech.',
    'SRC = faithful one-line transcription. Chinese in Simplified characters; Cantonese with its colloquial characters.',
    'TGT = if yue or cmn, translate into ' + my + '; otherwise translate into ' + zh + '.',
    'Rules:',
    '- Transcribe only words clearly audible in THIS audio. Never guess, never complete sentences, never reuse words from Background or earlier turns.',
    '- Noise, music, breathing or unclear sound is not speech: output LANG: none with empty SRC and TGT.',
    '- Keep numbers, prices, quantities, sizes and model codes exact, written as digits. Chinese prices are in yuan; 蚊 means yuan.',
    '- Translate the meaning naturally with the same tone. No answers, notes or added words.',
    'Output only these lines:',
    'LANG: <code>',
    'SRC: <text>',
    'TGT: <text>'
  ];
  if (S.romanize) L.push(S.zhStyle === 'cmn' ? 'JP: <Hanyu Pinyin with tone marks of the Chinese line>' : 'JP: <Jyutping with tone numbers of the Cantonese line>');
  L.push('Background (meaning only, never part of the audio): ' + (S.context || DEFAULT_CONTEXT).trim());
  if (history.length) {
    L.push('Earlier turns (context only, do not translate):');
    history.forEach(x => L.push((x.dir === 'out' ? 'A: ' : 'B: ') + String(x.src).slice(0, 140) + ' => ' + String(x.tgt).slice(0, 140)));
  }
  return L.join('\n');
}

function parseOut(raw) {
  const txt = String(raw || '').replace(/```[a-z]*/gi, '');
  const re = /^[ \t>*_-]*(LANG|SRC|TGT|JP)[ \t*_]*[:：][ \t]*/gim;
  const marks = [];
  let m;
  while ((m = re.exec(txt))) marks.push({ k: m[1].toUpperCase(), start: m.index, vstart: re.lastIndex });
  const out = { lang: '', src: '', tgt: '', jp: '' };
  const map = { LANG: 'lang', SRC: 'src', TGT: 'tgt', JP: 'jp' };
  marks.forEach((mk, i) => {
    const end = i + 1 < marks.length ? marks[i + 1].start : txt.length;
    const v = txt.slice(mk.vstart, end).replace(/\s*\n\s*/g, ' ').replace(/^[*_\s]+|[*_\s]+$/g, '').trim();
    const key = map[mk.k];
    if (!out[key]) out[key] = v;
  });
  out.lang = (out.lang.toLowerCase().match(/[a-z]+/) || [''])[0];
  const alias = { zh: 'cmn', mandarin: 'cmn', cantonese: 'yue', english: 'en', arabic: 'ar' };
  if (alias[out.lang]) out.lang = alias[out.lang];
  return out;
}

function thinkVariants(model) {
  const cached = store.get('think.' + model, 'unset');
  if (cached !== 'unset') return cached === null ? [null] : [cached, null];
  if (/gemini-2\./.test(model)) return [{ thinkingBudget: 0 }, null];
  return [{ thinkingLevel: 'minimal' }, { thinkingLevel: 'low' }, null];
}

let lastUsage = null;
async function callGemini(input, history, onText, retried) {
  if (!S.key) throw { code: 'nokey' };
  const model = (S.model || resolveTier(S.tier, S.models)).replace(/^models\//, '');
  const parts = [];
  if (input.audio) parts.push({ inlineData: { mimeType: 'audio/wav', data: input.audio } });
  parts.push({ text: input.audio ? 'Interpret this spoken turn.' : 'Interpret this typed turn:\n' + input.text });
  const base = {
    systemInstruction: { parts: [{ text: buildPrompt(history) }] },
    contents: [{ role: 'user', parts }],
    generationConfig: { maxOutputTokens: 700 }
  };
  if (/gemini-2\./.test(model)) base.generationConfig.temperature = 0.3;
  let lastErr;
  try {
    for (const tc of thinkVariants(model)) {
      const body = JSON.parse(JSON.stringify(base));
      if (tc) body.generationConfig.thinkingConfig = tc;
      try {
        const text = await streamRequest(model, body, onText);
        store.set('think.' + model, tc);
        return { text, usage: addUsage(lastUsage, model) };
      } catch (e) {
        lastErr = e;
        if (!(e && e.status === 400 && /think/i.test(e.message || ''))) throw e;
      }
    }
    throw lastErr;
  } catch (e) {
    if (!retried && e && e.status === 404 && !S.modelManual) {
      const before = S.model;
      try { await refreshModels(); } catch (x) {}
      if (S.model !== before) return callGemini(input, history, onText, true);
    }
    throw e;
  }
}

async function streamRequest(model, body, onText) {
  const url = API + '/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': S.key }, body: JSON.stringify(body), signal: ctrl.signal });
  } catch (e) {
    clearTimeout(timer);
    throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' };
  }
  if (!res.ok) {
    clearTimeout(timer);
    let msg = '';
    try { const j = await res.json(); msg = (j.error && j.error.message) || ''; } catch (e) {}
    throw { status: res.status, message: msg };
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '', full = '';
  lastUsage = null;
  try {
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).replace(/\r$/, '');
        buf = buf.slice(i + 1);
        if (!line.startsWith('data:')) continue;
        const data = line.slice(5).trim();
        if (!data) continue;
        let j;
        try { j = JSON.parse(data); } catch (e) { continue; }
        if (j.error) throw { status: j.error.code, message: j.error.message };
        if (j.usageMetadata) lastUsage = j.usageMetadata;
        const cand = j.candidates && j.candidates[0];
        const ps = (cand && cand.content && cand.content.parts) || [];
        let added = false;
        for (const p of ps) if (p.text && !p.thought) { full += p.text; added = true; }
        if (added) onText(full);
      }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') throw { code: 'timeout' };
    if (e && (e.status || e.code)) throw e;
    throw { code: 'network' };
  } finally { clearTimeout(timer); }
  return full;
}

async function listModels(key) {
  const names = [];
  let token = '';
  for (let n = 0; n < 5; n++) {
    let res;
    try { res = await fetch(API + '/models?pageSize=1000' + (token ? '&pageToken=' + encodeURIComponent(token) : ''), { headers: { 'x-goog-api-key': key } }); }
    catch (e) { throw { code: 'network' }; }
    if (!res.ok) { let msg = ''; try { msg = ((await res.json()).error || {}).message || ''; } catch (e) {} throw { status: res.status, message: msg }; }
    const j = await res.json();
    for (const m of (j.models || [])) {
      const id = String(m.name || '').replace(/^models\//, '');
      const methods = m.supportedGenerationMethods || [];
      if (/^gemini/.test(id) && methods.includes('generateContent') && !/(image|tts|live|embed|computer|robotic|audio|banana|veo|imagen|lyria|learnlm)/i.test(id)) names.push(id);
    }
    token = j.nextPageToken;
    if (!token) break;
  }
  return Array.from(new Set(names)).sort(cmpVer);
}

/* ================= token usage ================= */
const dayKey = d => (d || new Date()).toLocaleDateString('en-CA');
const emptyU = () => ({ in: 0, out: 0, n: 0, cost: 0 });
function loadU() {
  const U = store.get('usage', null) || {};
  if (!U.total) U.total = emptyU();
  if (!U.days || typeof U.days !== 'object') U.days = {};
  for (const b of [U.total].concat(Object.values(U.days))) { b.in = b.in || 0; b.out = b.out || 0; b.n = b.n || 0; b.cost = b.cost || 0; }
  return U;
}
function addUsage(u, model, kind) {
  if (!u) return null;
  const inT = u.promptTokenCount || 0;
  const aud = (u.promptTokensDetails || []).filter(d => /AUDIO/i.test(d.modality || '')).reduce((s, d) => s + (d.tokenCount || 0), 0);
  const out = (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0);
  const p = priceOf(model);
  const cost = (Math.max(0, inT - aud) * p.t + aud * p.a + out * p.o) / 1e6;
  const r = { in: inT, out, total: u.totalTokenCount || (inT + out), cost, model };
  const U = loadU();
  const d = dayKey();
  U.days[d] = U.days[d] || emptyU();
  const buckets = [U.total, U.days[d]];
  if (kind === 'cam') { U.cam = U.cam || emptyU(); buckets.push(U.cam); }
  for (const b of buckets) { b.in = (b.in || 0) + r.in; b.out = (b.out || 0) + r.out; b.n = (b.n || 0) + 1; b.cost = (b.cost || 0) + cost; }
  const keys = Object.keys(U.days).sort();
  while (keys.length > 90) delete U.days[keys.shift()];
  store.set('usage', U);
  if (tab === 'usage' && unlocked) renderUsage();
  return r;
}
const sumBucket = b => (b.in || 0) + (b.out || 0);
function convUsage(c) {
  const r = emptyU();
  if (c) c.turns.forEach(x => { if (x.usage) { r.in += x.usage.in || 0; r.out += x.usage.out || 0; r.n++; r.cost += x.usage.cost || 0; } });
  return r;
}

/* ================= a turn: audio/text in → translation out ================= */
async function processTurn(input, opts) {
  opts = opts || {};
  const c = ensureConv();
  const x = { id: uid(), t: Date.now(), lang: '', src: input.text || '', tgt: '', jp: '', dir: '', to: '', pending: true };
  let idx = c.turns.length, prev = null;
  if (opts.replaceId) { const i = c.turns.findIndex(y => y.id === opts.replaceId); if (i >= 0) { idx = i; prev = c.turns[i]; } }
  const history = c.turns.slice(0, idx).filter(y => !y.pending).slice(-4);
  if (prev) c.turns.splice(idx, 1, x); else c.turns.push(x);
  const feed = $('#feed');
  if ($('.empty', feed)) feed.textContent = '';
  const el = turnEl(x);
  const prevEl = prev ? feed.querySelector('[data-id="' + prev.id + '"]') : null;
  if (prevEl) prevEl.replaceWith(el); else feed.append(el);
  if (prevEl) el.scrollIntoView({ block: 'nearest' }); else scrollEnd();
  busy++; refreshStatus();
  try {
    const res = await callGemini(input, history, txt => {
      const p = parseOut(txt);
      if (p.lang === 'none') return;
      applyParsed(x, p);
      fillTurn(el, x);
      if (f2fOpen && x.dir) renderF2F(x);
      if (!prevEl) scrollEnd();
    });
    const p = parseOut(res.text);
    if (p.lang === 'none') throw { code: 'nospeech' };
    applyParsed(x, p);
    if (!x.lang || !x.tgt || (input.audio && !x.src)) throw { code: 'nospeech' };
    x.usage = res.usage || null;
    x.pending = false;
    x.to = x.dir === 'in' ? S.myLang : S.zhStyle;
    c.updated = Date.now();
    saveConvs();
    fillTurn(el, x);
    renderF2F();
    autoSpeakTurn(x);
  } catch (e) {
    const i = c.turns.indexOf(x);
    if (prev) { if (i >= 0) c.turns.splice(i, 1, prev); el.replaceWith(turnEl(prev)); }
    else { if (i >= 0) c.turns.splice(i, 1); el.remove(); }
    if (!c.turns.length) { convs = convs.filter(y => y !== c); currentId = null; renderFeed(); }
    renderF2F();
    showError(e);
  } finally {
    busy--; refreshStatus();
  }
}
function applyParsed(x, p) {
  if (p.lang) x.lang = p.lang;
  if (p.src) x.src = p.src;
  if (p.tgt) x.tgt = p.tgt;
  if (p.jp) x.jp = p.jp;
  if (x.lang && x.lang !== 'none') x.dir = isZh(x.lang) ? 'in' : 'out';
}

function showError(e) {
  e = e || {};
  const msg = e.message || '';
  let m;
  if (e.code === 'nospeech') m = t('e_nospeech');
  else if (e.code === 'nokey') { m = t('e_nokey'); setTab('talk'); renderFeed(); setTimeout(() => { const k = $('#obKey'); if (k) k.focus(); }, 60); }
  else if (e.code === 'network') m = t('e_net');
  else if (e.code === 'timeout') m = t('e_timeout');
  else if (/location|region|country/i.test(msg)) m = t('e_region');
  else if (/api key|API_KEY/i.test(msg) || e.status === 401) m = t('e_key');
  else if (e.status === 403) m = t('e_403');
  else if (e.status === 404) m = t('e_404');
  else if (e.status === 429) m = t('e_429');
  else if (e.status >= 500) m = t('e_500');
  else m = t('e_other', { m: msg ? ': ' + msg : (e.status ? ' (' + e.status + ')' : '.') });
  toast(m, e.code === 'nospeech' ? 'warn' : 'err');

/* ================= recording ================= */
const rec = { hold: false, cancel: false, ctx: null, stream: null, src: null, proc: null, chunks: [], levels: [], th: 0, speechRun: 0, rate: 48000, active: false, starting: false, speech: false, silence: 0, elapsed: 0, noise: 0, noiseN: 0 };
let ttsUnlocked = false;

function unlockAudio() {
  try {
    if (!rec.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) rec.ctx = new AC(); }
    if (rec.ctx && rec.ctx.state === 'suspended') rec.ctx.resume();
  } catch (e) {}
  if ('speechSynthesis' in window && !ttsUnlocked) {
    try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    ttsUnlocked = true;
  }
}

async function startRec() {
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw { name: 'Insecure' };
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  if (!rec.ctx) { stream.getTracks().forEach(x => x.stop()); throw { name: 'NoAudio' }; }
  if (rec.ctx.state === 'suspended') { try { await rec.ctx.resume(); } catch (e) {} }
  Object.assign(rec, { stream, chunks: [], levels: [], th: 0, speechRun: 0, rate: rec.ctx.sampleRate, speech: false, silence: 0, elapsed: 0, noise: 0, noiseN: 0, active: true });
  rec.src = rec.ctx.createMediaStreamSource(stream);
  rec.proc = rec.ctx.createScriptProcessor(4096, 1, 1);
  rec.proc.onaudioprocess = onAudio;
  rec.src.connect(rec.proc);
  rec.proc.connect(rec.ctx.destination);
  waveVals = new Array(WAVE_N).fill(0); drawWave();
  $('#liveTime').textContent = '0:00';
  clearInterval(liveTimer);
  liveTimer = setInterval(() => { $('#liveTime').textContent = fmtDur(rec.elapsed); }, 250);
  vib(15);
  refreshStatus();
}

function onAudio(e) {
  if (!rec.active) return;
  const d = e.inputBuffer.getChannelData(0);
  rec.chunks.push(new Float32Array(d));
  let sum = 0;
  for (let i = 0; i < d.length; i++) sum += d[i] * d[i];
  const rms = Math.sqrt(sum / d.length);
  rec.levels.push(rms);
  const ms = d.length / rec.rate * 1000;
  rec.elapsed += ms;
  setLevel(rms);
  if (rec.elapsed < 350) { rec.noise += rms; rec.noiseN++; return; }
  const floor = rec.noiseN ? rec.noise / rec.noiseN : 0.005;
  const th = Math.min(0.06, Math.max(0.012, floor * 2.8));
  rec.th = th;
  if (rms > th) { rec.speechRun++; if (rec.speechRun >= (rec.hold ? 1 : 2)) rec.speech = true; rec.silence = 0; }
  else { rec.speechRun = 0; if (rec.speech) rec.silence += ms; }
  const auto = S.autoStop && !rec.hold;
  if (rec.elapsed > (auto ? 60000 : 300000)) stopRec('max');
  else if (auto && rec.speech && rec.silence > 1100) stopRec('silence');
  else if (auto && !rec.speech && rec.elapsed > 9000) stopRec('nospeech');
}

function stopRec(reason) {
  if (!rec.active) return;
  rec.active = false;
  clearInterval(liveTimer);
  try { rec.proc.onaudioprocess = null; rec.proc.disconnect(); rec.src.disconnect(); } catch (e) {}
  try { rec.stream.getTracks().forEach(x => x.stop()); } catch (e) {}
  setLevel(0);
  vib(10);
  let chunks = rec.chunks; rec.chunks = [];
  const levels = rec.levels; rec.levels = [];
  const secs = rec.elapsed / 1000;
  rec.hold = false; rec.cancel = false;
  refreshStatus();
  if (reason === 'cancel') { toast(t('r_cancel')); return; }
  if (reason === 'abort') return;
  if (reason === 'nospeech' || !rec.speech) {
    if (secs >= 0.5) toast(t('r_nospeech'), 'warn');
    return;
  }
  if (secs < 0.5) return;
  if (reason === 'max') toast(t('r_max'), 'warn');
  // trim silence at both ends (keep ~0.35 s padding) so noise is never sent as speech
  const th = rec.th || 0.012;
  const first = levels.findIndex(v => v > th);
  let last = levels.length - 1;
  while (last > 0 && levels[last] <= th) last--;
  if (first >= 0 && last >= first) {
    const pad = Math.ceil(350 / (4096 / rec.rate * 1000));
    chunks = chunks.slice(Math.max(0, first - pad), Math.min(chunks.length, last + pad + 1));
  }
  processTurn({ audio: encodeWavB64(chunks, rec.rate) });
}

let lvlFrame = 0, lvlVal = 1;
function setLevel(rms) {
  lvlVal = 1 + Math.min(1, rms * 7) * 0.14;
  waveVals.push(rms); if (waveVals.length > WAVE_N) waveVals.shift();
  if (!lvlFrame) lvlFrame = requestAnimationFrame(() => {
    lvlFrame = 0;
    document.documentElement.style.setProperty('--lvl', lvlVal.toFixed(3));
    if (rec.active) drawWave();
  });
}

function encodeWavB64(chunks, inRate) {
  let len = 0;
  for (const c of chunks) len += c.length;
  const data = new Float32Array(len);
  let o = 0;
  for (const c of chunks) { data.set(c, o); o += c.length; }
  const outRate = 16000;
  const ratio = inRate / outRate;
  const outLen = Math.max(0, Math.floor(len / ratio));
  const f = new Float32Array(outLen);
  let peak = 0;
  for (let i = 0; i < outLen; i++) {
    const a = Math.floor(i * ratio), b = Math.min(len, Math.max(a + 1, Math.floor((i + 1) * ratio)));
    let s = 0;
    for (let j = a; j < b; j++) s += data[j];
    const v = s / (b - a);
    f[i] = v;
    const av = Math.abs(v);
    if (av > peak) peak = av;
  }
  const g = peak > 0.001 ? Math.max(1, Math.min(4, 0.9 / peak)) : 1;
  const buf = new ArrayBuffer(44 + outLen * 2);
  const dv = new DataView(buf);
  const ws = (off, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(off + i, str.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + outLen * 2, true); ws(8, 'WAVE');
  ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, outRate, true); dv.setUint32(28, outRate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  ws(36, 'data'); dv.setUint32(40, outLen * 2, true);
  for (let i = 0; i < outLen; i++) {
    const v = Math.max(-1, Math.min(1, f[i] * g));
    dv.setInt16(44 + i * 2, v < 0 ? v * 0x8000 : v * 0x7FFF, true);
  }
  const bytes = new Uint8Array(buf);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function onMic() {
  if (rec.active) { stopRec('manual'); return; }
  if (rec.starting) return;
  if (!S.key) { showError({ code: 'nokey' }); return; }
  unlockAudio();
  try { speechSynthesis.cancel(); } catch (e) {}
  requestWake();
  rec.starting = true;
  try { await startRec(); }
  catch (e) { micError(e); }
  finally { rec.starting = false; refreshStatus(); }
  if (rec.active && hold.releasedAt && Date.now() - hold.releasedAt < 1500) stopRec('abort');
  hold.releasedAt = 0;

/* press-and-hold to talk: hold = record while pressed, release = send, slide away = cancel; a short tap keeps the chosen mode */
const HOLD_MS = 350;
const hold = { id: null, t0: 0, x: 0, y: 0, timer: 0, handled: false, releasedAt: 0, tipShown: false };
function micDown(e) {
  if (e.button != null && e.button > 0) return;
  e.preventDefault();
  hold.handled = true;
  if (rec.active) { if (!rec.hold) stopRec('manual'); hold.id = null; return; }
  if (rec.starting) return;
  hold.id = e.pointerId; hold.t0 = Date.now(); hold.x = e.clientX; hold.y = e.clientY; hold.releasedAt = 0;
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {}
  rec.hold = false; rec.cancel = false;
  clearTimeout(hold.timer);
  hold.timer = setTimeout(() => { if (hold.id != null) { rec.hold = true; vib(12); refreshStatus(); } }, HOLD_MS);
  onMic();
}
function micMove(e) {
  if (e.pointerId !== hold.id || !rec.hold) return;
  const far = Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 90;
  if (far !== rec.cancel) { rec.cancel = far; if (far) vib(8); refreshStatus(); }
}
function micUp(e) {
  setTimeout(() => { hold.handled = false; }, 350);
  if (e.pointerId !== hold.id) return;
  clearTimeout(hold.timer);
  hold.id = null;
  const held = Date.now() - hold.t0 >= HOLD_MS;
  if (!held) {
    rec.hold = false; refreshStatus();
    if (!hold.tipShown && !store.get('holdTip', false)) { hold.tipShown = true; store.set('holdTip', true); setTimeout(() => toast(t('hold_tip')), 400); }
    return;
  }
  const cancel = rec.cancel || e.type === 'pointercancel';
  if (rec.active) stopRec(cancel ? 'cancel' : 'release');
  else hold.releasedAt = Date.now();
  rec.hold = false; rec.cancel = false; refreshStatus();
}
function micClick(e) {
  if (hold.handled) { hold.handled = false; return; }   // already handled by pointer events
  onMic();                                              // keyboard activation
}
function micError(e) {
  const n = e && e.name;
  let m;
  if (n === 'NotAllowedError' || n === 'SecurityError') m = t('mic_denied');
  else if (n === 'NotFoundError') m = t('mic_none');
  else if (n === 'Insecure') m = t('mic_insecure');
  else if (n === 'NoAudio') m = t('mic_noaudio');
  else m = t('mic_fail', { m: e && e.message ? ': ' + e.message : '.' });
  toast(m, 'err');
}

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } renderVoiceInfo(); }
function pickVoice(kind) {
  let tests;
  if (kind === 'yue') tests = [/^yue/i, /zh[-_]HK/i];
  else if (kind === 'cmn') tests = [/zh[-_]CN/i, /^cmn/i, /^zh$/i, /zh[-_]Hans/i];
  else { const tag = (LANG[kind] && LANG[kind].tts) || kind; tests = [new RegExp('^' + tag.replace('-', '[-_]') + '$', 'i'), new RegExp('^' + kind + '([-_]|$)', 'i')]; }
  for (const re of tests) { const v = voices.find(x => re.test(x.lang)); if (v) return v; }
  return null;
}
function speak(text, kind) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(kind);
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = (LANG[kind] && LANG[kind].tts) || 'en-US';
    u.rate = +S.vRate || 0.95;

}

const sigCanvas = document.createElement('canvas'); sigCanvas.width = 32; sigCanvas.height = 24;
const sigCtx = sigCanvas.getContext('2d', { willReadFrequently: true });
const frameCanvas = document.createElement('canvas');

function visibleRect() {
  const v = $('#camVideo');
  const W = v.clientWidth || 1, H = v.clientHeight || 1, vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return null;
  const k = Math.max(W / vw, H / vh), sw = W / k, sh = H / k;

}
function camSig() {

  try { sigCtx.drawImage($('#camVideo'), r.sx, r.sy, r.sw, r.sh, 0, 0, 32, 24); } catch (e) { return null; }
  const d = sigCtx.getImageData(0, 0, 32, 24).data;
  const g = new Float32Array(768);
  let m = 0;
  for (let i = 0; i < 768; i++) { g[i] = (d[i * 4] * 3 + d[i * 4 + 1] * 6 + d[i * 4 + 2]) / 10; m += g[i]; }

  frameCanvas.getContext('2d').drawImage($('#camVideo'), r.sx, r.sy, r.sw, r.sh, 0, 0, frameCanvas.width, frameCanvas.height);

}

async function startCam() {

    return;
  }
  if (tab !== 'camera') { stream.getTracks().forEach(x => x.stop()); return; }

function camTick() {
  if (!cam.on || cam.frozen) return;

  if (cam.inflight || now < cam.backoff || cam.steady < 600 || now - cam.lastSent < 2200) return;
  if (cam.sentSig && sigDiff(s, cam.sentSig) < 0.06) return;   // this view was already read

    renderCamUI();
  } catch (e) {
    if (!cam.on || seq !== cam.seq) return;
    cam.sentSig = null;
    if (e && e.code === 'nokey') { stopCam(); showError(e); return; }

    else if (e && (e.code === 'network' || e.code === 'timeout')) { cam.backoff = Date.now() + 5000; setCamStatus('net'); }

}

async function postJSON(model, body) {

  } catch (e) { clearTimeout(timer); throw { code: e && e.name === 'AbortError' ? 'timeout' : 'network' }; }

  if (!res.ok) throw { status: res.status, message: (j && j.error && j.error.message) || '' };

}
async function callVision(b64) {
  if (!S.key) throw { code: 'nokey' };
  const model = (S.model || resolveTier(S.tier, S.models)).replace(/^models\//, '');
  const base = {
    systemInstruction: { parts: [{ text: visionPrompt() }] },
    contents: [{ role: 'user', parts: [{ inlineData: { mimeType: 'image/jpeg', data: b64 } }, { text: 'Read and translate the Chinese text in this view.' }] }],
    generationConfig: { maxOutputTokens: 1400, responseMimeType: 'application/json' }
  };
  if (/gemini-2\./.test(model)) base.generationConfig.temperature = 0.2;
  let useMR = store.get('mr.' + model, true) !== false;
  let lastErr;
  for (const tc of thinkVariants(model)) {
    for (let pass = 0; pass < 2; pass++) {
      const body = JSON.parse(JSON.stringify(base));
      if (tc) body.generationConfig.thinkingConfig = tc;
      if (useMR) body.generationConfig.mediaResolution = 'MEDIA_RESOLUTION_MEDIUM';
      try {
        const j = await postJSON(model, body);
        store.set('think.' + model, tc); store.set('mr.' + model, useMR);
        addUsage(j.usageMetadata, model, 'cam');
        const cand = (j.candidates || [])[0];
        const text = ((cand && cand.content && cand.content.parts) || []).filter(x => x.text && !x.thought).map(x => x.text).join('');
        return parseItems(text);
      } catch (e) {
        lastErr = e;
        if (e && e.status === 400 && useMR && /resolution/i.test(e.message || '')) { useMR = false; continue; }
        if (e && e.status === 400 && /think/i.test(e.message || '')) break;
        if (e && e.status === 404 && !S.modelManual) { try { await refreshModels(); } catch (x) {} }
        throw e;

    }

}

  const raw = String(text || '').replace(/```json|```/gi, '').trim();
  let j = null;
  try { j = JSON.parse(raw); } catch (e) {
    const a = raw.indexOf('{'), k = raw.lastIndexOf('},');

  }

  return arr.map(it => ({
    b: (Array.isArray(it.b) ? it.b : Array.isArray(it.box_2d) ? it.box_2d : []).map(Number),
    zh: String(it.zh || '').trim(), t: String(it.t || '').trim(), e: String(it.e || '').trim(),
    h: ['pork', 'alcohol', 'blood', 'meat'].includes(String(it.h || '').toLowerCase()) ? String(it.h).toLowerCase() : '',

function renderHistory() {

    .filter(c => !q || norm(c.title + ' ' + c.turns.map(x => x.src + ' ' + x.tgt).join(' ')).includes(q));
  if (!items.length) { list.innerHTML = '<p class="muted">' + esc(t(q ? 'h_none_q' : 'h_none')) + '</p>'; return; }
  for (const c of items) {
    const done = c.turns.filter(x => !x.pending);
    const card = document.createElement('div');
    card.className = 'conv' + (c.id === currentId ? ' on' : '');
    card.innerHTML =
      '<div class="conv-top"><input class="conv-name" dir="auto" aria-label="' + esc(t('rename_title')) + '">' + (c.id === currentId ? '<span class="badge-now">' + esc(t('h_now')) + '</span>' : '') + '</div>' +
      '<div class="conv-meta"></div><div class="conv-prev" dir="auto"></div>' +
      '<div class="conv-acts">' +
      '<button class="btn sm" type="button" data-a="open">' + esc(t('h_open')) + '</button>' +
      '<button class="btn sm ghost" type="button" data-a="share"><svg class="ic"><use href="#i-share"/></svg>' + esc(t('h_share')) + '</button>' +
      '<button class="btn sm ghost" type="button" data-a="down"><svg class="ic"><use href="#i-down"/></svg>' + esc(t('h_down')) + '</button>' +
      '<button class="btn sm ghost danger" type="button" data-a="del"><svg class="ic"><use href="#i-trash"/></svg><span>' + esc(t('h_del')) + '</span></button>' +
      '</div>';
    const inp = $('.conv-name', card);
    inp.id = 'name-' + c.id; inp.value = c.title;
    inp.addEventListener('change', () => { c.title = inp.value.trim() || defaultTitle(c.created); saveConvs(); renderHeader(); });
    $('.conv-meta', card).textContent = t('h_meta', { d: fmtDate(c.updated), n: done.length });
    const lastT = done[done.length - 1];
    $('.conv-prev', card).textContent = lastT ? lastT.tgt : '';
    card.addEventListener('click', ev => {
      const b = ev.target.closest('button[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'open') { currentId = c.id; store.set('current', currentId); cancelEdit(); closeSheets(); setTab('talk'); renderFeed(); renderF2F(); }
      else if (a === 'share') shareConv(c);
      else if (a === 'down') downloadConv(c);
      else if (a === 'del') {
        if (b.dataset.confirm) {
          convs = convs.filter(x => x !== c);
          if (currentId === c.id) { currentId = null; renderFeed(); renderF2F(); }
          saveConvs(); renderHistory();
        } else {
          b.dataset.confirm = '1'; $('span', b).textContent = t('h_confirm');
          setTimeout(() => { if (b.isConnected) { delete b.dataset.confirm; $('span', b).textContent = t('h_del'); } }, 3500);
        }
      }
    });
    list.append(card);
  }
}

async function sha256Hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function fnv(s) { let h = 0x811c9dc5; for (const ch of new TextEncoder().encode(s)) { h ^= ch; h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }
async function checkPin(p) {
  try { if (window.crypto && crypto.subtle) return (await sha256Hex('yb:' + p)) === PIN_SHA; } catch (e) {}
  return fnv('yb:' + p) === PIN_FNV;
}

function lastDays(n) {
  const U = loadU();
  const out = [];
  const now = new Date();
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - i);
    const b = U.days[dayKey(d)] || emptyU();
    out.push({ date: d, tokens: sumBucket(b), n: b.n, cost: b.cost, today: i === 0 });
  }
  return out;
}
