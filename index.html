function niceCeil(v) {
  if (v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (m * e >= v) return m * e;
  return 10 * e;
}
function drawChart(days) {
  const wrap = $('#chart');
  const W = Math.max(260, Math.floor(wrap.clientWidth || 320));
  const H = 170, padT = 22, padB = 24, padL = 36, padR = 4;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max(...days.map(d => d.tokens), 0);
  const top = niceCeil(max || 1000);
  const n = days.length, slot = iw / n, gap = Math.max(2, Math.min(8, slot * 0.28)), bw = slot - gap;
  const y = v => padT + ih - (v / top) * ih;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '" role="img" aria-label="' + esc(t('u_chart_aria')) + '" direction="ltr">';
  [0, 0.5, 1].forEach(f => {
    const yy = y(top * f).toFixed(1);
    s += '<line class="' + (f === 0 ? 'base' : 'grid') + '" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yy + '" y2="' + yy + '"/>';
    s += '<text class="axis" x="' + (padL - 6) + '" y="' + (+yy + 4) + '" text-anchor="end">' + fmtK(top * f) + '</text>';
  });
  days.forEach((d, i) => {
    const x = padL + i * slot + gap / 2;
    const hh = (d.tokens / top) * ih;
    s += '<rect class="hit" data-i="' + i + '" x="' + (padL + i * slot).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + ih + '"/>';
    if (hh > 0) {
      const r = Math.min(4, bw / 2, hh);
      const yt = padT + ih - hh, yb = padT + ih;
      s += '<path class="bar" data-b="' + i + '" d="M' + x.toFixed(1) + ',' + yb + 'V' + (yt + r).toFixed(1) + 'Q' + x.toFixed(1) + ',' + yt.toFixed(1) + ' ' + (x + r).toFixed(1) + ',' + yt.toFixed(1) + 'H' + (x + bw - r).toFixed(1) + 'Q' + (x + bw).toFixed(1) + ',' + yt.toFixed(1) + ' ' + (x + bw).toFixed(1) + ',' + (yt + r).toFixed(1) + 'V' + yb + 'Z"/>';
    }
    if (d.today && d.tokens > 0) s += '<text class="val" x="' + (x + bw / 2).toFixed(1) + '" y="' + (padT + ih - hh - 6).toFixed(1) + '" text-anchor="middle">' + fmtK(d.tokens) + '</text>';
    if (d.today || (n - 1 - i) % 2 === 0) s += '<text class="axis' + (d.today ? ' now' : '') + '" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(d.today ? t('u_today') : String(d.date.getDate())) + '</text>';
  });
  s += '</svg><div class="tip" id="chartTip" hidden></div>';
  wrap.innerHTML = s;
  const tip = $('#chartTip');
  const show = i => {
    const d = days[i];
    tip.innerHTML = esc(d.today ? t('u_today') : fmtDay(d.date)) + '<br>' + fmtN(d.tokens) + ' ' + esc(t('u_tok')) + ' · ' + fmtN(d.n) + ' ' + esc(t('u_req')) + '<br>' + fmtUSD(d.cost);
    const cx = (padL + (i + 0.5) * slot) / W * wrap.clientWidth;
    const ty = Math.max(30, (d.tokens ? y(d.tokens) : padT + ih) - 8);
    tip.style.left = Math.min(wrap.clientWidth - 70, Math.max(70, cx)) + 'px';
    tip.style.top = ty + 'px';
    tip.hidden = false;
    $$('.bar', wrap).forEach(b => b.classList.toggle('sel', +b.dataset.b === i));
  };
  $$('.hit', wrap).forEach(hh => {
    hh.addEventListener('pointerenter', () => show(+hh.dataset.i));
    hh.addEventListener('pointerdown', () => show(+hh.dataset.i));
  });
  wrap.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { tip.hidden = true; $$('.bar', wrap).forEach(b => b.classList.remove('sel')); } });
}

async function connect() {
  if (!S.key) { setConnectState(t('c_need_key'), 'err'); return false; }
  setConnectState(t('c_checking'), '');
  $$('#connectBtn, [data-act="ob-connect"]').forEach(b => { b.disabled = true; });
  try {
    await refreshModels();
    setConnectState(t('c_ok', { m: S.model }), 'ok');
    if (!$('#sheet-settings').hidden) { renderTiers(); fillModelSelect(); }
    return true;
  } catch (e) {
    let m;
    if (e.code === 'network') m = t('c_net');
    else if (/location|region|country/i.test(e.message || '')) m = t('c_region');
    else if (e.status === 400 || e.status === 401 || e.status === 403) m = t('c_bad');
    else m = t('c_fail', { s: e.status ? ' (' + e.status + ')' : '' });
    setConnectState(m, 'err');
    return false;
  } finally { $$('#connectBtn, [data-act="ob-connect"]').forEach(b => { b.disabled = false; }); }
}

    if (!current()) renderFeed();
  });
  $('#keyShow').addEventListener('click', () => { const i = $('#keyInput'); i.type = i.type === 'password' ? 'text' : 'password'; });
  $('#connectBtn').addEventListener('click', async () => { S.key = $('#keyInput').value.trim(); saveSettings(); await connect(); if (!current()) renderFeed(); });
  $('#modelSelect').addEventListener('change', e => { S.model = e.target.value; S.modelManual = true; saveSettings(); renderTiers(); setConnectState(t('c_manual', { m: S.model }), 'ok'); });
  $$('input[name="uiLang"]').forEach(r => r.addEventListener('change', () => {
    S.ui = r.value; saveSettings();
    const open = !$('#sheet-settings').hidden;
    rerenderAll();
    if (open) renderSettings();
  }));
  $('#myLang').addEventListener('change', e => { S.myLang = e.target.value; saveSettings(); renderF2F(); if (!current()) renderFeed(); });
  $$('input[name="zhStyle"]').forEach(r => r.addEventListener('change', () => { S.zhStyle = r.value; saveSettings(); renderF2F(); if (!current()) renderFeed(); }));
  $('#romanize').addEventListener('change', e => { S.romanize = e.target.checked; saveSettings(); renderFeed(); });
  $('#ctxInput').addEventListener('change', e => { S.context = e.target.value.trim() || DEFAULT_CONTEXT; saveSettings(); });
  $('#ctxReset').addEventListener('click', () => { S.context = DEFAULT_CONTEXT; $('#ctxInput').value = DEFAULT_CONTEXT; saveSettings(); });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#cardOv').hidden) closeCard();
      else if (!$('#scrim').hidden) closeSheets();
      else if (f2fOpen) closeF2F();
      return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (tab === 'usage' && !unlocked && !typing && $('#scrim').hidden) {
      if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pressKey(e.key); return; }
      if (e.key === 'Backspace') { e.preventDefault(); pressKey('del'); return; }
    }
    if (e.code === 'Space' && !e.repeat && tab === 'camera' && cam.on && !typing && $('#scrim').hidden) { e.preventDefault(); toggleFreeze(); return; }
    if (e.code === 'Space' && !e.repeat && tab === 'talk' && !typing && document.activeElement.tagName !== 'BUTTON' && $('#scrim').hidden && $('#cardOv').hidden) { e.preventDefault(); onMic(); }
  });
  let rz = 0;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (tab === 'usage' && unlocked) drawChart(lastDays(14)); if (cam.on && cam.items.length) renderLabels(); }, 150); });
}

function init() {
  if (currentId && !current()) currentId = null;
  saveSettings();
  applyI18n();
  buildWave();
  bind();
  $('#rm-' + (S.autoStop ? 'auto' : 'manual')).checked = true;
  if (S.calc) { $('#cPrice').value = S.calc.p || ''; $('#cQty').value = S.calc.q || ''; }
  renderFeed();
  refreshStatus();
  const t0 = store.get('tab', 'talk');
  setTab(TABS.includes(t0) ? t0 : 'talk');
  if ('speechSynthesis' in window) { loadVoices(); try { speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { speechSynthesis.onvoiceschanged = loadVoices; } }
}

window.__yb = { rec, hold, parseItems, visionPrompt, cam, parseOut, encodeWavB64, resolveTier, buildPrompt, fxChips, checkPin, priceOf, per1000USD, S };
init();
})();

</script>
</body>
